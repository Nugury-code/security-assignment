<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>패스키 등록 (관리용)</title>
<style>
  body{
    font-family: -apple-system, 'IBM Plex Sans KR', sans-serif;
    max-width: 520px;
    margin: 60px auto;
    padding: 0 20px;
    color: #241F45;
    line-height: 1.6;
  }
  h1{ font-size: 20px; }
  .warn{
    background: #fff4e5;
    border: 1px solid #f0c987;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13.5px;
    color: #6b4a12;
    margin-bottom: 24px;
  }
  input{
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
    margin-bottom: 12px;
  }
  button{
    background: #5D2BC7;
    color: white;
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
  }
  button:disabled{ opacity: 0.5; cursor: default; }
  #msg{ margin-top: 14px; font-size: 14px; }
  #msg.ok{ color: #1a7a3c; }
  #msg.err{ color: #b43c14; }
  ul{ padding-left: 18px; }
  li{ margin-bottom: 6px; font-size: 14px; }
  .date{ color: #777; font-size: 12.5px; }
</style>
</head>
<body>
  <h1>🔑 패스키 등록 (나만 쓰는 페이지)</h1>
  <p class="warn">
    ⚠️ 이 페이지는 아직 아무 접근 제한이 없습니다 — 지금은 누구든 URL을 알면 여기서 자기 패스키를 등록할 수 있습니다.
    카드 5에서 이 부분을 반드시 막아야 합니다. 지금은 등록 절차 자체가 맞게 동작하는지만 확인하는 단계입니다.
  </p>

  <input type="text" id="pk-name" placeholder="이 패스키의 별명 (예: 내 노트북 Windows Hello)">
  <button id="btn-register">새 패스키 등록</button>
  <div id="msg"></div>

  <h2 style="font-size:16px; margin-top:32px;">등록된 패스키 목록</h2>
  <ul id="pk-list"><li>불러오는 중…</li></ul>

<script src="https://unpkg.com/@simplewebauthn/browser/dist/bundle/index.umd.min.js"></script>
<script>
(function(){
  var nameInput = document.getElementById('pk-name');
  var btn = document.getElementById('btn-register');
  var msg = document.getElementById('msg');
  var list = document.getElementById('pk-list');

  function showMsg(text, ok){
    msg.textContent = text;
    msg.className = ok ? 'ok' : 'err';
  }

  function loadList(){
    fetch('/api/passkeys')
      .then(function(res){ return res.json(); })
      .then(function(data){
        list.innerHTML = '';
        if (!data.items || data.items.length === 0){
          list.innerHTML = '<li>아직 등록된 패스키가 없습니다.</li>';
          return;
        }
        data.items.forEach(function(item){
          var li = document.createElement('li');
          var d = new Date(item.createdAt);
          li.innerHTML = item.name + ' <span class="date">(' + d.toLocaleString('ko-KR') + ' 등록)</span>';
          list.appendChild(li);
        });
      })
      .catch(function(){
        list.innerHTML = '<li>목록을 불러오지 못했습니다.</li>';
      });
  }

  btn.addEventListener('click', function(){
    var name = nameInput.value.trim();
    if (!name){
      showMsg('먼저 이 패스키를 알아볼 이름을 입력해 주세요.', false);
      return;
    }
    if (!window.SimpleWebAuthnBrowser){
      showMsg('패스키 라이브러리를 불러오지 못했습니다. 네트워크 상태를 확인해 주세요.', false);
      return;
    }
    if (!window.PublicKeyCredential){
      showMsg('이 브라우저는 패스키(WebAuthn)를 지원하지 않습니다.', false);
      return;
    }

    btn.disabled = true;
    showMsg('등록 창을 여는 중…', true);

    fetch('/api/register/options', { credentials: 'same-origin' })
      .then(function(res){
        if (!res.ok) throw new Error('서버에서 등록용 질문을 받지 못했습니다.');
        return res.json();
      })
      .then(function(optionsJSON){
        return window.SimpleWebAuthnBrowser.startRegistration({ optionsJSON: optionsJSON });
      })
      .then(function(credential){
        return fetch('/api/register/verify', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, credential: credential })
        });
      })
      .then(function(res){ return res.json().then(function(data){ return { ok: res.ok, data: data }; }); })
      .then(function(result){
        if (result.ok && result.data.success){
          showMsg('등록 완료: "' + name + '"', true);
          nameInput.value = '';
          loadList();
        } else {
          showMsg('등록 실패: ' + (result.data.message || result.data.error || '알 수 없는 오류'), false);
        }
      })
      .catch(function(err){
        // 사용자가 패스키 생성 창에서 취소했을 때도 여기로 온다.
        // 이 경우 서버에는 아무 것도 전송/저장되지 않는다.
        if (err && (err.name === 'NotAllowedError' || /cancel/i.test(String(err.message)))){
          showMsg('등록이 취소되었습니다. 서버에는 아무것도 저장되지 않았습니다.', false);
        } else {
          showMsg('오류: ' + (err.message || err), false);
        }
      })
      .finally(function(){
        btn.disabled = false;
      });
  });

  loadList();
})();
</script>
</body>
</html>
